<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#grad2)" opacity="0.9"/>
  <!-- M letterform -->
  <path d="M50 145 L50 65 L80 65 L100 105 L120 65 L150 65 L150 145 L130 145 L130 95 L110 130 L90 130 L70 95 L70 145 Z"
        fill="white" opacity="0.95" filter="url(#glow)"/>
  <!-- Small accent dot -->
  <circle cx="155" cy="50" r="6" fill="#c084fc" opacity="0.8"/>
  <!-- Subtle "KN" hint - two small bars -->
  <rect x="55" y="155" width="12" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="72" y="155" width="8" height="3" rx="1.5" fill="white" opacity="0.25"/>
</svg>
