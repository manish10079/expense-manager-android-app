      const toggleBtn = document.getElementById('theme-toggle-btn');
      const appHeader = document.getElementById('app-header');
      const headerTitle = document.getElementById('header-title');
      const backBtn = document.getElementById('back-btn');
      const searchBtn = document.getElementById('search-btn');
      const userProfileInner = document.getElementById('user-profile-inner');
      const userNameText = document.getElementById('user-name-text');
      const profileEditBtn = document.getElementById('profile-edit-btn');
      const bottomBar = document.getElementById('bottom-bar');
      const signoutBtn = document.getElementById('signout-btn');

      const containerCards = document.querySelectorAll('.theme-container-card');
      const itemTitles = document.querySelectorAll('.theme-item-title');
      const subtitles = document.querySelectorAll('.theme-subtitle');
      const sectionHeaders = document.querySelectorAll('.theme-section-header');
      const chevrons = document.querySelectorAll('.theme-chevron');
      const counterBadges = document.querySelectorAll('.theme-counter-badge');
      const listItems = document.querySelectorAll('.theme-list-item');
      const navItems = document.querySelectorAll('.theme-nav-item');

      if (isDark) {
        // Dark Mode State
        html.classList.add('dark');
        html.classList.remove('light');

        if (sunIcon) { sunIcon.classList.remove('hidden'); sunIcon.classList.add('block'); }
        if (moonIcon) { moonIcon.classList.remove('block'); moonIcon.classList.add('hidden'); }

        body.style.backgroundColor = '#0B0D14';
        body.style.color = '#FFFFFF';

        if (toggleBtn) {
          toggleBtn.className = 'p-2 rounded-xl text-amber-400 hover:bg-[#1E2235] active:scale-95 transition';
        }
        if (appHeader) {
          appHeader.style.backgroundColor = 'rgba(11, 13, 20, 0.9)';
          appHeader.style.borderColor = 'rgba(34, 39, 56, 0.5)';
        }
        if (headerTitle) { headerTitle.style.color = '#FFFFFF'; }
        if (backBtn) { backBtn.style.color = 'rgba(255, 255, 255, 0.9)'; }
        if (searchBtn) { searchBtn.style.color = '#94a3b8'; }

        if (userProfileInner) {
          userProfileInner.style.backgroundColor = '#151824';
          userProfileInner.style.boxShadow = '';
        }
        if (userNameText) { userNameText.style.color = '#FFFFFF'; }
        if (profileEditBtn) { profileEditBtn.style.color = '#94a3b8'; }

        containerCards.forEach(card => {
          card.style.backgroundColor = '#151824';
          card.style.borderColor = '#222738';
          card.style.boxShadow = '';
          card.className = card.className.replace(/divide-slate-100/g, 'divide-[#222738]/60');
        });

        listItems.forEach(item => {
          item.classList.remove('hover:bg-slate-50', 'active:bg-slate-100');
          item.classList.add('hover:bg-[#1c2030]', 'active:bg-[#1f2438]');
        });

        itemTitles.forEach(t => t.style.color = '#FFFFFF');
        subtitles.forEach(s => s.style.color = '#8E9BAE');
        sectionHeaders.forEach(h => h.style.color = '#8E9BAE');
        chevrons.forEach(c => c.style.color = '#64748B');

        counterBadges.forEach(badge => {
          badge.style.backgroundColor = '#1E2235';
          badge.style.color = '#cbd5e1';
        });

        if (signoutBtn) {
          signoutBtn.style.backgroundColor = '#151824';
          signoutBtn.style.borderColor = 'rgba(136, 19, 55, 0.3)';
        }

        if (bottomBar) {
          bottomBar.style.backgroundColor = 'rgba(21, 24, 36, 0.95)';
          bottomBar.style.borderColor = '#222738';
          bottomBar.style.boxShadow = '';
        }
        navItems.forEach(item => item.style.color = '#8E9BAE');

      } else {
        // Light Mode State
        html.classList.remove('dark');
        html.classList.add('light');

        if (sunIcon) { sunIcon.classList.remove('block'); sunIcon.classList.add('hidden'); }
        if (moonIcon) { moonIcon.classList.remove('hidden'); moonIcon.classList.add('block'); }

        body.style.backgroundColor = '#F8FAFC';
        body.style.color = '#0F172A';

        if (toggleBtn) {
          toggleBtn.className = 'p-2 rounded-xl text-slate-700 hover:bg-slate-200 active:scale-95 transition';
        }
        if (appHeader) {
          appHeader.style.backgroundColor = 'rgba(248, 250, 252, 0.92)';
          appHeader.style.borderColor = '#E2E8F0';
        }
        if (headerTitle) { headerTitle.style.color = '#0F172A'; }
        if (backBtn) { backBtn.style.color = '#1E293B'; }
        if (searchBtn) { searchBtn.style.color = '#64748B'; }

        if (userProfileInner) {
          userProfileInner.style.backgroundColor = '#FFFFFF';
          userProfileInner.style.boxShadow = '0 4px 15px -3px rgba(0, 0, 0, 0.07)';
        }
        if (userNameText) { userNameText.style.color = '#0F172A'; }
        if (profileEditBtn) { profileEditBtn.style.color = '#64748B'; }

        containerCards.forEach(card => {
          card.style.backgroundColor = '#FFFFFF';
          card.style.borderColor = '#E2E8F0';
          card.style.boxShadow = '0 2px 8px -2px rgba(0, 0, 0, 0.05)';
          card.className = card.className.replace(/divide-\[#222738\]\/60/g, 'divide-slate-100');
        });

        listItems.forEach(item => {
          item.classList.remove('hover:bg-[#1c2030]', 'active:bg-[#1f2438]');
          item.classList.add('hover:bg-slate-50', 'active:bg-slate-100');
        });

        itemTitles.forEach(t => t.style.color = '#0F172A');
        subtitles.forEach(t => t.style.color = '#64748B');
        sectionHeaders.forEach(h => h.style.color = '#64748B');
        chevrons.forEach(c => c.style.color = '#94a3b8');

        counterBadges.forEach(badge => {
          badge.style.backgroundColor = '#F1F5F9';
          badge.style.color = '#475569';
        });

        if (signoutBtn) {
          signoutBtn.style.backgroundColor = '#FFFFFF';
          signoutBtn.style.borderColor = '#FECDD3';
        }

        if (bottomBar) {
          bottomBar.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
          bottomBar.style.borderColor = '#E2E8F0';
          bottomBar.style.boxShadow = '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)';
        }
        navItems.forEach(item => item.style.color = '#64748B');
      }
    }

    function toggleTheme() {
      applyTheme(!currentIsDark);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Start in Dark mode
      applyTheme(true);

      const themeToggleBtn = document.getElementById('theme-toggle-btn');
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          toggleTheme();
        });
      }
    });
  </script>
<!-- Live Clock updater for status bar mockup -->
<script data-purpose="live-clock">
    function updateClock() {
      const clockEl = document.getElementById('current-time');
      if (!clockEl) return;
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      hours = hours % 12 || 12;
      clockEl.textContent = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body></html>
